<div class="section-divider"></div>

<c-container fluid class="skills-section py-5" id="skills">
  <c-row class="justify-content-center">
    <c-col xs="12" md="10" lg="9">
      
      <div class="section-header text-center mb-5">
        <h2 class="section-title">
          <ng-icon name="ionCodeSlash" class="me-3"></ng-icon>
          Compétences
        </h2>
        <div class="title-underline"></div>
      </div>

        <c-row class="g-4">
          @for (skill of user.skills; track skill.id) {
          <c-col xs="12" md="6">
            <c-card class="skill-card">
              <c-card-body>
                <div class="skill-header">
                  <ng-icon [name]="skill.icon" size="28" class="skill-icon"></ng-icon>                  <h3>{{ skill.label }}</h3>
                </div>
                <div class="badge-container">
                  @for (competency of skill.competencies; track competency){
                  <c-badge class="skill-badge">{{ competency }}</c-badge>
                  }
                </div>
              </c-card-body>
            </c-card>
          </c-col>
      }
      </c-row>
    </c-col>
  </c-row>
</c-container>
