<!-- Section Hero avec dégradé -->
<c-container fluid class="about-section py-4 px-0" id="contact">
  <c-row class="justify-content-center align-items-center mb-5">
    <c-col xs="12" md="4" class="text-center mb-0 mb-md-0">
      <div class="profile-image-container">
        <img [src]="user.photoUrl" alt="Photo de profil" class="profile-image">
      </div>
    </c-col>
  </c-row>
  
  <c-row class="justify-content-center">
    <c-col xs="12" md="8" class="text-center">
      <h2 class="name-title mb-2">{{ user.firstname }} {{ user.lastname }}</h2>
      <h3 class="role-title mb-3">{{ user.jobTitle }}</h3>
      
      <div class="social-links mb-4">
        <a [href]="user.linkedinUrl" target="_blank" class="social-link linkedin" aria-label="LinkedIn">
          <ng-icon name="ionLogoLinkedin" size="24"></ng-icon>
        </a>
        <a [href]="user.githubUrl" target="_blank" class="social-link github" aria-label="GitHub">
          <ng-icon name="ionLogoGithub" size="24"></ng-icon>
        </a>
        <a [href]="user.mailUrl" class="social-link email" aria-label="Email">
          <ng-icon name="ionMail" size="24"></ng-icon>
        </a>
        @if(user.discord){
        <a [href]="user.discordUrl" target="_blank" class="social-link discord" aria-label="Discord">
          <ng-icon name="ionLogoDiscord" size="24"></ng-icon>
        </a>}
        @if (user.phoneNumber){
        <a [href]="user.phoneUrl" class="social-link phone" aria-label="Téléphone">
          <ng-icon name="ionCall" size="22"></ng-icon>
        </a>}
      </div>
      
      <div class="button-group">
        <a href="#projects">
          <button class="custom-button primary-button">
            <ng-icon name="ionCodeSlash" class="me-2"></ng-icon>
            Mes Projets
          </button>
        </a>
        <!-- <button class="custom-button secondary-button">
          <ng-icon name="ionMail" class="me-2"></ng-icon>
          Me contacter
        </button> -->
      </div>
      
    </c-col>
  </c-row>
</c-container>

<!-- Section À propos avec transition fluide -->
<c-container fluid class="about-content-section px-0" id="about">
  <c-row class="g-0">
    <c-col xs="12">
      <c-card class="about-card border-0">
        <c-card-header class="about-card-header text-center border-0">
          <h3 class="section-title mb-0">
            <ng-icon name="ionPerson" class="me-2"></ng-icon>
            À propos
          </h3>
        </c-card-header>
        <c-card-body class="p-4" class="about-text"  [innerHTML]="getSafeHtml(user.about)">
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</c-container>
